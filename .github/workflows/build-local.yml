# Replaces dist's builtin `build-local-artifacts` job (disabled with
# `build-local-artifacts = false` in dist-workspace.toml) and is called from the
# generated release.yml as the `custom-build-local` job.
#
# It exists so the macOS builds can run in the `release` environment, which holds
# the codesigning secrets; the generated job has no way to declare an environment.
# Apart from that it mirrors the builtin job, so when bumping `cargo-dist-version`,
# diff this file against the job in dist's templates/ci/github/release.yml.j2.
name: Build local artifacts

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    if: ${{ fromJson(inputs.plan).ci.github.artifacts_matrix.include != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.plan).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    # Only the macOS builds sign anything, so only they get the signing secrets.
    environment: ${{ contains(join(matrix.targets, ','), 'apple-darwin') && 'release' || '' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
      IS_MACOS: ${{ contains(join(matrix.targets, ','), 'apple-darwin') }}
      # Read by `dist build` (see `macos-sign` in dist-workspace.toml); unset off macOS.
      CODESIGN_CERTIFICATE: ${{ secrets.CODESIGN_CERTIFICATE }}
      CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
      # Hardened runtime, which notarization requires.
      CODESIGN_OPTIONS: runtime
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      # `dist build` only warns and ships unsigned binaries when a secret is missing.
      - name: Check codesigning secrets
        if: ${{ env.IS_MACOS == 'true' }}
        run: |
          for var in CODESIGN_CERTIFICATE CODESIGN_CERTIFICATE_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::$var is not set; is this job running in the 'release' environment?"
              exit 1
            fi
          done
      # TEMPORARY: discover the certificate's identity so it can be written into
      # this file as CODESIGN_IDENTITY. Remove once it's hardcoded.
      - name: Discover codesigning identity
        if: ${{ env.IS_MACOS == 'true' }}
        run: |
          dir="$(mktemp -d)"
          keychain="$dir/discover.keychain-db"
          echo "$CODESIGN_CERTIFICATE" | base64 --decode > "$dir/cert.p12"
          # Diagnose the container format without printing anything secret.
          echo "decoded .p12: $(wc -c < "$dir/cert.p12") bytes, first byte 0x$(xxd -p -l1 "$dir/cert.p12")"
          case "$CODESIGN_CERTIFICATE_PASSWORD" in *[[:space:]]) echo "::warning::password secret ends with whitespace";; esac
          openssl="$(brew --prefix openssl@3)/bin/openssl"
          "$openssl" version
          "$openssl" pkcs12 -in "$dir/cert.p12" -info -noout -passin env:CODESIGN_CERTIFICATE_PASSWORD 2>&1 || echo "::warning::openssl could not open the .p12 with the password"
          "$openssl" pkcs12 -in "$dir/cert.p12" -nokeys -clcerts -passin env:CODESIGN_CERTIFICATE_PASSWORD 2>/dev/null \
            | "$openssl" x509 -noout -subject -issuer -enddate -nameopt utf8,sep_multiline || true
          security create-keychain -p discover "$keychain"
          security unlock-keychain -p discover "$keychain"
          security import "$dir/cert.p12" -k "$keychain" -P "$CODESIGN_CERTIFICATE_PASSWORD" -f pkcs12 -A
          security find-identity -v -p codesigning "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/^ *1) [0-9A-F]\{40\} "\(.*\)"$/\1/p')"
          security delete-keychain "$keychain"
          rm -rf "$dir"
          [ -n "$identity" ] || { echo "::error::no codesigning identity found in the certificate"; exit 1; }
          echo "Identity: $identity"
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      # Check the binary that actually ships, inside the archive, not the build output.
      - name: Verify codesigning
        if: ${{ env.IS_MACOS == 'true' }}
        run: |
          set -o pipefail
          for archive in target/distrib/*-apple-darwin.tar.xz; do
            dir="$(mktemp -d)"
            tar -xJf "$archive" -C "$dir"
            found=0
            while IFS= read -r bin; do
              found=1
              echo "::group::$archive: ${bin#"$dir"/}"
              codesign --verify --strict --verbose=2 "$bin"
              info="$(codesign --display --verbose=4 "$bin" 2>&1)"
              echo "$info"
              echo "::endgroup::"
              grep -qxF "Authority=$CODESIGN_IDENTITY" <<< "$info" \
                || { echo "::error::${bin#"$dir"/} in $archive is not signed by $CODESIGN_IDENTITY"; exit 1; }
              grep -q '^CodeDirectory .*flags=.*(runtime)' <<< "$info" \
                || { echo "::error::${bin#"$dir"/} in $archive is not signed with the hardened runtime"; exit 1; }
            done < <(find "$dir" -type f -perm -u+x -exec sh -c 'file -b "$1" | grep -q Mach-O' _ {} \; -print)
            [ "$found" = 1 ] || { echo "::error::no Mach-O binary found in $archive"; exit 1; }
            rm -rf "$dir"
          done
          # The updater is a prebuilt axoupdater binary that dist doesn't sign; report only.
          for updater in target/distrib/*-apple-darwin-update; do
            [ -f "$updater" ] || continue
            echo "::group::$updater (not required to be signed)"
            codesign --display --verbose=2 "$updater" 2>&1 || true
            echo "::endgroup::"
          done
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
