name: Publish to crates.io
run-name: Publish the icp-* crates to crates.io from ${{ inputs.version }}

# Publishes the workspace members that do not say `publish = false`:
# icp-events, icp-canister-interfaces, icp-project and icp-sync-plugin. They are
# libraries other tools build on, released with the CLI and under its version.
#
# A crates.io release is permanent. A bad one can be yanked, which hides it from
# new dependency resolution, and replaced by a new version, never re-published.
#
# Authentication is trusted publishing (OIDC): there is no crates.io token in
# this repository's secrets. Each crate needs this workflow registered once, on
# crates.io under Settings -> Trusted Publishing:
#   Repository owner   dfinity
#   Repository name    icp-cli
#   Workflow filename  release-crates.yml
#   Environment name   release
# which crates.io only offers for a crate that already exists, so the first
# release of each is published by hand, in the order of the list below.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to publish from (e.g., v1.9.0)'
        required: true
        type: string

concurrency:
  group: release-crates-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # Everything that runs project and dependency code (build scripts, proc
  # macros) happens here, in a job that cannot ask for a crates.io credential.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.version }}

      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          cache: false

      - name: Check the tag matches the workspace version
        env:
          TAG: ${{ inputs.version }}
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -er '.packages[] | select(.name == "icp-project") | .version')
          if [[ "v$version" != "$TAG" ]]; then
            echo "::error::$TAG holds version $version" >&2
            exit 1
          fi

      # Builds each crate from its packaged form, against the packaged form of
      # the others, which is what someone depending on them will build.
      - name: Package
        run: cargo publish --workspace --dry-run --locked

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.version }}

      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          cache: false

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # One at a time, each after the ones it depends on, and skipping any the
      # registry already holds at this version, so a run that failed part-way
      # can be run again.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          TAG: ${{ inputs.version }}
        run: |
          version="${TAG#v}"
          for crate in icp-events icp-canister-interfaces icp-project icp-sync-plugin; do
            # The sparse index files a name of four or more characters under
            # its first two and next two.
            if curl -fsS "https://index.crates.io/${crate:0:2}/${crate:2:2}/$crate" \
                | jq -e --arg v "$version" 'select(.vers == $v)' >/dev/null; then
              echo "$crate $version is already on crates.io"
              continue
            fi
            cargo publish --locked --no-verify -p "$crate"
          done
