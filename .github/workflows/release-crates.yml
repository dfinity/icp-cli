name: Publish to crates.io
run-name: Publish the icp-* crates to crates.io from ${{ inputs.version }}

# Publishes the workspace members that do not say `publish = false`:
# icp-events, icp-canister-interfaces, icp-project and icp-sync-plugin. They are
# libraries other tools build on, released with the CLI under a 0.x version of
# their own (see "Published crates" in Cargo.toml).
#
# A crates.io release is permanent. A bad one can be yanked, which hides it from
# new dependency resolution, and replaced by a new version, never re-published.
#
# Authentication is trusted publishing (OIDC): there is no crates.io token in
# this repository's secrets. Each crate needs this workflow registered once, on
# crates.io under Settings -> Trusted Publishing:
#   Repository owner   dfinity
#   Repository name    icp-cli
#   Workflow filename  release-crates.yml
#   Environment name   release
# which crates.io only offers for a crate that already exists, so the first
# release of each is published by hand, in the order of the list below.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to publish from (e.g., v1.9.0). A tag, not a branch.'
        required: true
        type: string

concurrency:
  group: release-crates-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # Everything that runs project and dependency code (build scripts, proc
  # macros) happens here, in a job that cannot ask for a crates.io credential.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      crates-version: ${{ steps.source.outputs.crates-version }}
    steps:
      # `refs/tags/`, so a branch of the same name is not a release.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ inputs.version }}
          # Full history: the ancestry check below needs the commits between
          # the tag and main, which the default shallow clone does not fetch.
          fetch-depth: 0

      # A tag can name any commit in the repository, including one that never
      # went through review: a topic branch, or a commit since rebased away.
      - name: Check the tag is on main
        env:
          TAG: ${{ inputs.version }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG points at a commit that is not on main" >&2
            exit 1
          fi

      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          cache: false

      # The tag is the CLI's version; the crates have their own, and all four
      # the same one. The commit is recorded so the publish job takes exactly
      # what was verified here, wherever the tag points by the time that job
      # is approved.
      - name: Check the tag and read what it holds
        id: source
        env:
          TAG: ${{ inputs.version }}
        run: |
          metadata=$(cargo metadata --format-version 1 --no-deps)
          cli=$(jq -er '.packages[] | select(.name == "icp-cli") | .version' <<<"$metadata")
          if [[ "v$cli" != "$TAG" ]]; then
            echo "::error::$TAG holds icp-cli $cli" >&2
            exit 1
          fi
          versions=$(jq -er '[.packages[] | select(.publish == null) | .version] | unique | join(" ")' <<<"$metadata")
          if [[ "$versions" == *" "* ]]; then
            echo "::error::the published crates are not at one version: $versions" >&2
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "crates-version=$versions" >> "$GITHUB_OUTPUT"

      # Builds each crate from its packaged form, against the packaged form of
      # the others, which is what someone depending on them will build.
      - name: Package
        run: cargo publish --workspace --dry-run --locked

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      # The commit the verify job built, not the tag again.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          cache: false

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # One at a time, each after the ones it depends on, and skipping any the
      # registry already holds at this version, so a run that failed part-way
      # can be run again.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.verify.outputs.crates-version }}
        run: |
          version="$VERSION"
          for crate in icp-events icp-canister-interfaces icp-project icp-sync-plugin; do
            # The sparse index files a name of four or more characters under
            # its first two and next two.
            if curl -fsS "https://index.crates.io/${crate:0:2}/${crate:2:2}/$crate" \
                | jq -e --arg v "$version" 'select(.vers == $v)' >/dev/null; then
              echo "$crate $version is already on crates.io"
              continue
            fi
            cargo publish --locked --no-verify -p "$crate"
          done
