[package]
name = "icp-events"
# Not the CLI's version: see "Published crates" in the workspace Cargo.toml.
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
description = "Typed progress events that icp-cli's operations report and its renderers draw."
repository = { workspace = true }
readme = "README.md"
keywords = ["icp", "internet-computer", "dfinity"]
publish = true

[dependencies]
serde = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
