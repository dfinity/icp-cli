[package]
name = "icp-sync-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
camino.workspace = true
candid.workspace = true
console.workspace = true
icp-events.workspace = true
# Only for the seams the runtime is driven through — the plugin invocation and
# the canister calls it makes — never for `host`-feature code, which is what
# this crate is an implementation of.
icp-project = { path = "../icp-project", default-features = false }
semver.workspace = true
snafu.workspace = true
# `rt-multi-thread` for `block_in_place`, which the runtime needs because a
# wasm import cannot suspend while a canister call is in flight.
tokio = { workspace = true, features = ["rt-multi-thread"] }
wasmtime.workspace = true
wasmtime-wasi.workspace = true

[build-dependencies]
camino.workspace = true

[dev-dependencies]
camino-tempfile.workspace = true
# The mocks these tests use are host-side, so this one keeps the default
# features the library half deliberately does without.
icp-project = { path = "../icp-project", features = ["test-util"] }
url.workspace = true

[lints]
workspace = true
