# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v0.1.0/docs/schemas/icp-yaml-schema.json

canisters:
  - name: my-canister
    recipe:
      type: "@dfinity/rust@v3.4.0"
      configuration:
        # cargo package for canister; optional, defaults to the canister
        # name. Needed here because this crate is not named `my-canister`.
        package: icp-canister
        shrink: true
        # optional
        candid: greeter.did
        metadata:
          - name: "crate:version"
            value: 1.0.0
