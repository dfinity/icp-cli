# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/heads/main/docs/schemas/icp-yaml-schema.json

canisters:
  - name: docs
    recipe:
      # certified-assets: certified static hosting with automatic clean URLs
      # (trailing-slash canonicalization) and `_headers`/`_redirects` support.
      # The recipe pins a matched canister + sync-plugin pair, so there is no
      # separate canister version to select.
      type: "@dfinity/static-site@v0.3.1"
      configuration:
        # The whole assembled docs-deployment branch (all versions + root files).
        dir: .
